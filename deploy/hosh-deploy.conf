# Read ONCE by `hosh-deploy register drawtogether` on the box (box standard, Decision #16), which validates
# the compose hardening and pins the result in /etc/hosh-deploy/apps/drawtogether.conf. Changing this file
# in the repo changes nothing on the box until someone re-registers there.
SERVICE=drawtogether
IMAGE_REPO=ghcr.io/pazka/drawtogether
IMAGE_VAR=APP_IMAGE
ENV_FILE=drawtogether.env
HOST=draw.hosh.it
BIND=127.0.0.1:9135
HEALTH=/healthz
# Capability smoke run INSIDE the container after each deploy (argv, no shell; non-zero ⇒ auto-rollback):
# /healthz (uploads + store writable), room list, front for a room, import read back, image upload served
# back, Socket.IO join. All in one fixed room `hosh-deploy-smoke` (overwritten each run).
POST_DEPLOY=node /app/scripts/capability-smoke.js http://127.0.0.1:8000
REPO=pazka/DrawTogether
