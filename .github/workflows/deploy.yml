name: deploy

# Deploy a release to the hosh.it box through hosh-deploy (box standard, Decision #16).
# - called by release.yml after a successful release (auto-deploy; repo variable
#   HOSH_AUTODEPLOY=false turns that off)
# - or by hand: Actions → deploy → "vX.Y.Z" (redeploy / roll forward), "rollback" or "status".
# The box only accepts: a release tag whose image exists on GHCR, for THIS app (the SSH key is bound
# to it on the box). It verifies the new version and rolls back by itself if it is not healthy.
# Secret HOSH_DEPLOY_KEY (per repo) = private half of the app's deployer key; unset ⇒ job skipped.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (vX.Y.Z), 'rollback' or 'status'"
        required: true

permissions:
  contents: read

concurrency:
  group: hosh-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: hosh-deploy on the box
        env:
          KEY: ${{ secrets.HOSH_DEPLOY_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then echo "::notice::HOSH_DEPLOY_KEY is not set: nothing deployed"; exit 0; fi
          case "$VERSION" in
            rollback|status) cmd="$VERSION" ;;
            v[0-9]*.[0-9]*.[0-9]*) cmd="deploy $VERSION" ;;
            *) echo "::error::version must be vX.Y.Z, rollback or status (got '$VERSION')"; exit 1 ;;
          esac
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/hosh && chmod 600 ~/.ssh/hosh
          # the box's host key (pinned: a different key = not our box → refuse)
          echo "54.37.70.57 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOjrBFwjPmbkcjJNWK5JvQPEGWWOewzM8oYYCCfU9igb" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/hosh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
              -o ConnectTimeout=20 deployer@54.37.70.57 "$cmd"
